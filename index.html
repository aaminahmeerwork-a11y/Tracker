<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker</title>
<meta name="theme-color" content="#cfe4f6" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: a single phone column under a sky gradient; content scrolls, bottom bar floats. */
@font-face{font-family:"Hafs";src:url(hafs.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Amiri";src:url(amiri-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Amiri";src:url(amiri-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Newsreader";src:url(newsreader-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Newsreader";src:url(newsreader-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Newsreader";src:url(newsreader-400i.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Figtree";src:url(figtree-700.woff2) format("woff2");font-weight:700;font-display:swap}

:root{
  --sky-1:#bcdcf5; --sky-2:#e3f0fb; --sky-3:#f6fafe;
  --ink:#0f2a44; --ink-2:#3d5a78; --muted:#6c86a2;
  --accent:#2f80c8; --accent-ink:#ffffff; --accent-soft:rgba(47,128,200,.12);
  --gold:#b07a2a; --done:#1f8a5b; --done-soft:rgba(31,138,91,.12); --warn:#c0663a;
  --card:rgba(255,255,255,.72); --card-2:rgba(255,255,255,.5); --line:rgba(15,42,68,.10);
  --shadow:0 6px 24px rgba(30,70,120,.10);
  --rose:#b85a74; --rose-soft:rgba(184,90,116,.12);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Amiri",sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --f-q:"Hafs","Amiri","Noto Naskh Arabic",serif;
  color-scheme:light;
}
:root[data-sky="night"]{
  --sky-1:#071328; --sky-2:#0e2141; --sky-3:#16305a;
  --ink:#e8f0fa; --ink-2:#b9cbe2; --muted:#8299b8;
  --accent:#7db8ee; --accent-ink:#071328; --accent-soft:rgba(125,184,238,.14);
  --gold:#e3b96e; --done:#5fd29a; --done-soft:rgba(95,210,154,.14); --warn:#f0a070;
  --card:rgba(255,255,255,.07); --card-2:rgba(255,255,255,.04); --line:rgba(232,240,250,.10);
  --shadow:0 6px 24px rgba(0,0,0,.25);
  --rose:#e79ab0; --rose-soft:rgba(231,154,176,.14);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--ink);
  background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 42%,var(--sky-3) 100%) fixed;background-color:var(--sky-2);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#stars{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
:root[data-sky="night"] #stars{opacity:1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
.view{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;background:var(--card);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.small{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.4}
.tnum{font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:23px;line-height:2.05;word-spacing:1px}
.q{font-family:var(--f-q);direction:rtl;text-align:justify;text-align-last:center;font-size:25px;line-height:2.15}
.en{font-size:16px;line-height:1.6;color:var(--ink-2)}
.ref{color:var(--gold);font-family:var(--f-display);font-weight:600;font-size:15px}
.seg{display:flex;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tick{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:all .2s}
.tick svg{width:18px;height:18px;opacity:0;transition:opacity .2s}
.is-done .tick{background:var(--done);border-color:var(--done)}
.is-done .tick svg{opacity:1}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.status{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.ok{background:var(--done-soft);color:var(--done)}
.status.behind{background:rgba(192,102,58,.12);color:var(--warn)}
.banner{border-radius:18px;padding:12px 14px;background:var(--accent-soft);font-size:14px}
.banner.rose{background:var(--rose-soft)}

/* Bottom bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-right,0px));pointer-events:none}
nav.tabs .bar{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 10px 30px rgba(20,50,90,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:6px}
:root[data-sky="night"] nav.tabs .bar{background:rgba(14,33,65,.92)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:20px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Home */
.greet{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.greet .date{font-family:var(--f-display);font-size:17px;color:var(--ink-2);margin-top:4px}
.iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.iconbtn svg{width:22px;height:22px}
.salahring{display:grid;place-items:center;position:relative;margin:4px auto 0;width:min(78vw,280px);aspect-ratio:1;max-width:100%}
.salahring svg{position:absolute;inset:0;width:100%;height:100%}
.salahring .mid{text-align:center}
.salahring .mid b{display:block;font-family:var(--f-display);font-size:44px;line-height:1}
.prayers{display:flex;justify-content:space-between;gap:4px}
.prayers button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.prayers .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.prayers .on{color:var(--done)}
.prayers .on .dot{background:var(--done);border-color:var(--done)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.plan .big{font-family:var(--f-display);font-size:28px;line-height:1;font-weight:600}
.plan .sub{font-size:13px;color:var(--muted)}
.week{display:flex;justify-content:space-between;gap:4px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week .d.today{color:var(--accent)}
.periodcard{display:flex;align-items:center;justify-content:space-between;gap:12px}
.periodcard.on{background:var(--rose-soft);border-color:transparent}

/* Hadith */
.hcard{display:flex;flex-direction:column;gap:12px}
.hcard .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hcard .ar{font-size:22px}
.hcard.is-done{opacity:.75}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .iconbtn{width:40px;height:40px}

/* Quran */
.qpage{display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.surah{text-align:center;padding:10px 0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 0}
.surah .name{font-family:var(--f-q);font-size:28px;line-height:1.6}
.bism{font-family:var(--f-q);text-align:center;font-size:24px;line-height:2}
.paused{text-align:center;padding:28px 18px}

/* Adhkar */
.dhikr{display:flex;flex-direction:column;gap:10px;width:100%;text-align:inherit}
.lwa{display:flex;flex-wrap:wrap;direction:rtl;gap:0 7px;justify-content:flex-start}
.lwa i{display:block;background:var(--ink);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;flex:none}
.dhikr .count{font-family:var(--f-display);font-weight:600;font-size:17px}
.dhikr.is-done{border-color:var(--done);}
.dhikr.is-done .count{color:var(--done)}

/* Salah */
.prayer{display:flex;flex-direction:column;gap:12px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:72px;padding:9px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card-2);font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.2}
.part b{font-family:var(--f-display);font-size:20px;color:var(--ink)}
.part.opt{border-style:dashed}
.part.on{background:var(--done);border-color:var(--done);color:#fff}
.part.on b{color:#fff}

/* Tasbih */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.stats4 b{display:block;font-family:var(--f-display);font-size:22px;color:var(--gold)}
.stats4 span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.titem{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:100%}
.titem .name{font-family:var(--f-display);font-size:22px;font-weight:600}
.counter{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,var(--sky-1),var(--sky-3));display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.counter .ring{flex:1;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.counter .beads{width:min(84vw,360px);aspect-ratio:1;position:relative;max-width:100%}
.counter .beads svg{width:100%;height:100%}
.counter .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.counter .num b{display:block;font-family:var(--f-display);font-size:76px;line-height:1;color:var(--accent)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,15,30,.45);display:flex;align-items:flex-end}
.sheet .panel{width:100%;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--sky-3);border-radius:26px 26px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field textarea{font:inherit;font-weight:400;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:var(--ink);color:var(--sky-3);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main class="wrap" id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Sections"><div class="bar" id="tabbar"></div></nav>
<div id="overlay"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const START='2026-11-01', END='2027-10-31', PLAN_DAYS=365;
const QURAN_PAGES=604, READING_SHARE=281/365; // 7 period days a month assumed
const STORE='tracker-v1';
const HM=['Muharram','Safar','Rabi al-Awwal','Rabi al-Thani','Jumada al-Ula','Jumada al-Akhirah','Rajab','Shaban','Ramadan','Shawwal','Dhul Qadah','Dhul Hijjah'];
const SALAH=[
 {id:'fajr',name:'Fajr',parts:[['s1',2,'Sunnah'],['f',2,'Fard']]},
 {id:'dhuhr',name:'Dhuhr',parts:[['s1',4,'Sunnah'],['f',4,'Fard'],['s2',2,'Sunnah'],['n1',2,'Nafl',1]]},
 {id:'asr',name:'Asr',parts:[['s1',4,'Sunnah'],['f',4,'Fard']]},
 {id:'maghrib',name:'Maghrib',parts:[['f',3,'Fard'],['s2',2,'Sunnah'],['n1',2,'Nafl',1]]},
 {id:'isha',name:'Isha',parts:[['s1',4,'Sunnah'],['f',4,'Fard'],['s2',2,'Sunnah'],['n1',2,'Nafl',1],['w',3,'Witr'],['n2',2,'Nafl',1]]},
];
const DEFAULT_TASBIH=[
 {id:'k1',name:'1st Kalimah',ar:'لَا إِلٰهَ إِلَّا اللّٰهُ مُحَمَّدٌ رَّسُوْلُ اللّٰهِ',target:300},
 {id:'k3',name:'3rd Kalimah',ar:'سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ وَلَا إِلٰهَ إِلَّا اللّٰهُ وَاللّٰهُ أَكْبَرُ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ الْعَلِيِّ الْعَظِيْمِ',target:300},
 {id:'ist',name:'Istighfar',ar:'',target:300},
 {id:'dur',name:'Durood',ar:'',target:1000},
];
const ICON={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>',
 hadith:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1 6-1 8 1v14c-2-2-5-2-8-1z"/><path d="M20 5c-3-1-6-1-8 1v14c2-2 5-2 8-1z"/></svg>',
 quran:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
 salah:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V11a8 8 0 0116 0v10"/><path d="M12 3v2"/><path d="M8 21v-6a4 4 0 018 0v6"/></svg>',
 adhkar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
 tasbih:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>',
 left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const todayKey=()=>keyOf(new Date());
const fmtDate=(k,opt={weekday:'short',day:'numeric',month:'short'})=>parseKey(k).toLocaleDateString('en-GB',opt);

/* ---------- state ---------- */
let S;
function fresh(){return{v:1,hadith:{},quran:{pages:{},khatam:0},salah:{},periods:[],adhkar:{},tasbih:{items:DEFAULT_TASBIH.map(x=>({...x})),counts:{}},hijri:null,theme:'auto',created:todayKey()}}
function load(){try{const raw=localStorage.getItem(STORE);S=raw?JSON.parse(raw):fresh()}catch(e){S=fresh()}
  const f=fresh();for(const k in f) if(S[k]===undefined) S[k]=f[k];
  if(!S.hijri) S.hijri=initHijri();}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){toast('Could not save. Phone storage may be full.')}},150)}
function persistNow(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
window.addEventListener('pagehide',persistNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistNow();else{applySky();render()}});

/* ---------- period days ---------- */
function isPeriod(k){return S.periods.some(p=>k>=p.s&&(!p.e||k<=p.e))}
function periodOn(){const p=S.periods[S.periods.length-1];return p&&!p.e?p:null}
function togglePeriod(){
  const t=todayKey(),p=periodOn();
  if(p){ if(p.s===t) S.periods.pop(); else p.e=addDays(t,-1); toast('Period days ended');}
  else{S.periods.push({s:t,e:null});toast('Period days on. Salah and Quran paused');}
  save();render();
}

/* ---------- Hijri (tabular base + your moon answers) ---------- */
function tabularLen(y,m){if(m%2===1)return 30;if(m<12)return 29;return [2,5,7,10,13,16,18,21,24,26,29].includes(((y-1)%30)+1)?30:29}
function initHijri(){
  let t=todayKey(),parts;
  try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-civil',{day:'numeric',month:'numeric',year:'numeric'});
    parts=Object.fromEntries(f.formatToParts(parseKey(t)).map(p=>[p.type,p.value]));}catch(e){parts=null}
  if(parts&&parts.day){const d=parseInt(parts.day),m=parseInt(parts.month),y=parseInt(parts.year);return{start:addDays(t,-(d-1)),y,m,len:{},shift:0}}
  return{start:'2026-10-13',y:1448,m:5,len:{},shift:0};
}
function hLen(y,m){return S.hijri.len[y+'-'+m]??tabularLen(y,m)}
function hijriOf(k){
  const H=S.hijri;let s=addDays(H.start,H.shift||0),y=H.y,m=H.m;
  if(k<s){ // walk back
    while(k<s){m--;if(m<1){m=12;y--}s=addDays(s,-hLen(y,m))}
  }
  while(diffDays(s,k)>=hLen(y,m)){s=addDays(s,hLen(y,m));m++;if(m>12){m=1;y++}}
  return{d:diffDays(s,k)+1,m,y,start:s};
}
function hijriText(k){const h=hijriOf(k);return `${h.d} ${HM[h.m-1]} ${h.y} AH`}
function moonQuestion(){
  const t=todayKey(),h=hijriOf(t);
  if(h.d!==29) return null;
  if(S.hijri.len[h.y+'-'+h.m]!==undefined) return null;
  if(new Date().getHours()<15) return null;
  const nm=h.m===12?1:h.m+1;return{h,next:HM[nm-1]};
}
function answerMoon(yes){const q=moonQuestion();if(!q)return;S.hijri.len[q.h.y+'-'+q.h.m]=yes?29:30;save();toast(yes?`${q.next} starts tomorrow`:'One more day this month');render()}

/* ---------- sky (day/night by Bradford sunrise & sunset) ---------- */
function sunTimes(date,lat=53.79,lng=-1.75){
  const rad=Math.PI/180,day=Math.floor((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(date.getFullYear(),0,0))/864e5);
  const g=2*Math.PI/365*(day-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(decl))-Math.tan(lat*rad)*Math.tan(decl))/rad;
  const rise=720-4*(lng+ha)-eq, set=720-4*(lng-ha)-eq; // minutes UTC
  const base=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());
  return{rise:new Date(base+rise*6e4),set:new Date(base+set*6e4)};
}
function isNight(){if(S.theme==='day')return false;if(S.theme==='night')return true;const n=new Date(),t=sunTimes(n);return n<t.rise||n>t.set}
function applySky(){const night=isNight();document.documentElement.dataset.sky=night?'night':'day';
  document.getElementById('themeColor').setAttribute('content',night?'#071328':'#bcdcf5');drawStars()}
function drawStars(){const c=document.getElementById('stars');if(!c)return;const w=innerWidth,h=innerHeight,dpr=devicePixelRatio||1;
  c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<70;i++){x.globalAlpha=.25+r()*.6;x.fillStyle='#dfeaff';x.beginPath();x.arc(r()*w,r()*h*.7,r()*1.3+.2,0,7);x.fill()}}
setInterval(applySky,60000);addEventListener('resize',drawStars);

/* ---------- data loading ---------- */
const cache={};
async function getJSON(f){if(cache[f])return cache[f];const r=await fetch(f);if(!r.ok)throw new Error(f);return cache[f]=await r.json()}
let META=null,QURAN=null,ADHKAR=null,MANZIL=null,LWA=null;
async function lwa(){if(LWA)return LWA;LWA=await getJSON('lwa.json');let css='';for(const k in LWA)css+=`.w-${k}{-webkit-mask-image:url(${LWA[k].src});mask-image:url(${LWA[k].src})}`;const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);return LWA}
const WS=0.36;
function lwaHTML(k){const v=LWA[k];return `<div class="lwa" lang="ar" aria-label="Dua ${k}">`+v.w.map(([x,w])=>`<i class="w-${k}" style="width:${(w*WS).toFixed(1)}px;height:${(v.h*WS).toFixed(1)}px;-webkit-mask-size:${(v.W*WS).toFixed(1)}px ${(v.h*WS).toFixed(1)}px;mask-size:${(v.W*WS).toFixed(1)}px ${(v.h*WS).toFixed(1)}px;-webkit-mask-position:-${(x*WS).toFixed(1)}px 0;mask-position:-${(x*WS).toFixed(1)}px 0"></i>`).join('')+'</div>'}
async function meta(){return META||(META=await getJSON('hadith-meta.json'))}
async function hadithDay(i){const m=await meta();const ch=await getJSON(`hadith-${pad(Math.floor(i/m.chunk)+1)}.json`);return ch[i%m.chunk]}
async function quran(){if(QURAN)return QURAN;const q=await getJSON('quran.json');const byPage={},bySA={};for(const a of q.ayahs){(byPage[a[2]]||(byPage[a[2]]=[])).push(a);bySA[a[0]+':'+a[1]]=a}
  return QURAN={...q,byPage,bySA}}

/* ---------- plan maths ---------- */
const planDay=()=>diffDays(START,todayKey()); // 0 on 1 Nov
function hadithStatus(){
  if(!META) return null;
  const i=Math.min(planDay(),PLAN_DAYS-1);let expected=0,read=0;
  for(let d=0;d<i;d++) expected+=META.plan[d].length; // days before today
  for(const n in S.hadith) read++;
  const todayList=i>=0?META.plan[i]:META.plan[0];
  const todayRead=todayList.filter(n=>S.hadith[n]).length;
  const readNotToday=read-(i>=0?todayRead:0);
  return{i,expected:i<0?0:expected,read,diff:(()=>{if(i<0)return 0;let un=0,fut=0;for(let d=0;d<i;d++)for(const n of META.plan[d])if(!S.hadith[n])un++;for(let d=i+1;d<PLAN_DAYS;d++)for(const n of META.plan[d])if(S.hadith[n])fut++;return un?-un:fut})(),todayTotal:todayList.length,todayRead,total:META.total};
}
function quranExpected(upto){
  const t=upto||todayKey();if(t<START)return 0;let exp=0;
  const last=t>END?END:t;
  for(let k=START;k<=last;k=addDays(k,1)){ if(isPeriod(k))continue;
    const remain=diffDays(k,END)+1;const eff=Math.max(1,remain*READING_SHARE);exp+=(QURAN_PAGES-exp)/eff; }
  return Math.min(QURAN_PAGES,exp);
}
function quranStatus(){
  const read=Object.keys(S.quran.pages).length;const exp=quranExpected();
  const target=Math.ceil(exp-1e-9);const todayNeed=Math.max(0,target-read);
  let first=1;while(first<=QURAN_PAGES&&S.quran.pages[first])first++;
  const due=Math.ceil(quranExpected(addDays(todayKey(),-1))-1e-9);
  return{read,exp,target,todayNeed,first,diff:read<due?read-due:Math.max(0,read-target)};
}
function todayBlock(qs){const t=todayKey();const b=S.quran.today;
  if(!b||b.k!==t){S.quran.today={k:t,from:qs.first,n:Math.max(1,qs.todayNeed)};save()}
  return S.quran.today;}
function adhkarDay(k){return S.adhkar[k]||(S.adhkar[k]={m:{},e:{},z:false})}
function adhkarDone(k,which){if(!ADHKAR)return false;const d=S.adhkar[k];if(!d)return false;const list=ADHKAR[which==='m'?'morning':'evening'];return list.every((x,i)=>(d[which][i]||0)>=x.n)}
function salahDay(k){return S.salah[k]||(S.salah[k]={})}
function fardCount(k){const d=S.salah[k]||{};return SALAH.filter(p=>d[p.id+'.f']).length}
function tasbihToday(k){let t=0;for(const id in S.tasbih.counts)t+=S.tasbih.counts[id][k]||0;return t}
function dayScore(k){ // for the week strip
  if(isPeriod(k)) return null;
  let parts=0,done=0;
  parts+=5;done+=fardCount(k);
  if(ADHKAR){parts+=2;done+=(adhkarDone(k,'m')?1:0)+(adhkarDone(k,'e')?1:0)}
  return done/parts;
}

/* ---------- UI helpers ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function ring(frac,size=44,stroke=5,color='var(--accent)'){const r=(size-stroke)/2,c=2*Math.PI*r,f=Math.max(0,Math.min(1,frac||0));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`}
function statusPill(diff,unit){if(diff>=0)return `<span class="status ok">${diff>0?diff+' '+unit+' ahead':'On track'}</span>`;return `<span class="status behind">${-diff} ${unit} behind</span>`}

function setTab(t){tab=t;ui.hDay=null;ui.salahDay=null;scrollTo(0,0);render();try{history.replaceState(null,'','#'+t)}catch(e){}}

/* ---------- HADITH ---------- */
async function viewHadith(){
  const m=await meta();const pd=planDay();
  if(ui.hDay===null) ui.hDay=Math.max(0,Math.min(pd,PLAN_DAYS-1));
  const hs=hadithStatus();
  if(ui.hMode==='catch'){
    const upto=Math.min(pd,PLAN_DAYS);const nums=[];for(let d=0;d<upto;d++)for(const n of m.plan[d]) if(!S.hadith[n]) nums.push([d,n]);
    const days=[...new Set(nums.map(x=>x[0]))];const items=[];
    for(const d of days.slice(0,10)){const list=await hadithDay(d);for(const h of list) if(!S.hadith[h.n]) items.push([d,h])}
    return `<section class="view"><div class="row between"><h2>Catch up</h2><button class="btn ghost small" data-act="hmode" data-v="day">Back to today</button></div>
      <p class="muted" style="margin:0">${nums.length} hadith left from earlier days.${days.length>10?' Showing the oldest 10 days first.':''}</p>
      ${items.map(([d,h])=>hcard(h,d,m)).join('')||'<div class="card">All caught up, alhamdulillah.</div>'}</section>`;
  }
  const d=ui.hDay,list=await hadithDay(d),date=addDays(START,d);
  const read=list.filter(h=>S.hadith[h.n]).length;
  let earlier=0;for(let k=0;k<Math.min(pd,PLAN_DAYS);k++)for(const n of m.plan[k]) if(!S.hadith[n]) earlier++;
  return `<section class="view">
   <div class="daynav"><button class="iconbtn" data-act="hday" data-v="-1" aria-label="Previous day" ${d<=0?'disabled':''}>${ICON.left}</button>
     <div style="text-align:center"><h2>Day ${d+1} <span class="muted" style="font-size:16px">of 365</span></h2><div class="small muted">${fmtDate(date,{weekday:'long',day:'numeric',month:'long'})}${d===pd?' · today':''}</div></div>
     <button class="iconbtn" data-act="hday" data-v="1" aria-label="Next day" ${d>=PLAN_DAYS-1?'disabled':''}>${ICON.right}</button></div>
   ${pd<0&&d===0?`<div class="banner">Your plan starts on ${fmtDate(START,{weekday:'long',day:'numeric',month:'long'})}. You can read ahead, and ticks will count.</div>`:''}
   <div class="card"><div class="row between"><div><b class="tnum" id="hcount">${read} of ${list.length}</b> <span class="muted small">read on this day</span></div>${pd>=0?statusPill(hs.diff,'hadith'):''}</div>

     <div class="row" style="flex-wrap:wrap"><button class="btn small" data-act="hall" data-v="${d}">Mark all read</button>

   ${list.map(h=>hcard(h,d,m)).join('')}

  </section>`;

function hcard(h,d,m){const done=!!S.hadith[h.n];const book=m.sections[String(h.b)]||'';

    <div class="progress" style="margin-top:12px"><i style="width:${qs.read/604*100}%"></i></div>
    <div class="row between small muted" style="margin-top:6px"><span>${qs.read} of 604 pages</span><span>Ends 31 Oct 2027</span></div></div>
   <div class="daynav"><button class="iconbtn" data-act="qpage" data-v="-1" aria-label="Previous page" ${p<=1?'disabled':''}>${ICON.left}</button>
     <button class="pill" data-act="qjump">Page ${p}${pages.length>1?'–'+pages[pages.length-1]:''}</button>
     <button class="iconbtn" data-act="qpage" data-v="1" aria-label="Next page" ${pages[pages.length-1]>=QURAN_PAGES?'disabled':''}>${ICON.right}</button></div>
   ${ui.qPage!==null?`<button class="btn ghost small" style="align-self:center" data-act="qtoday">Back to today's pages</button>`:''}
   ${pages.map(k=>qpage(Q,k)).join('')}
   ${pages.length&&pages.every(k=>S.quran.pages[k])&&pages[pages.length-1]<QURAN_PAGES?`<button class="btn" data-act="qnext" data-v="${pages[pages.length-1]+1}">Read the next page</button>`:''}
  </section>`;
}
function qpage(Q,k){const ay=Q.byPage[k],done=!!S.quran.pages[k];let html='';
  for(const a of ay){ if(a[1]===1){html+=`<div class="surah"><div class="name">سُورَةُ ${Q.suras[a[0]][0]}</div><div class="small muted">${esc(Q.suras[a[0]][1])}</div></div>`;
      if(a[0]!==1&&a[0]!==9) html+=`<div class="bism">${esc(stripNum(Q.ayahs[0][4]))}</div>`;}
    html+=`<span>${esc(a[4])} </span>`; }
  // group consecutive spans into paragraphs between headers
  html=html.replace(/((?:<span>[\s\S]*?<\/span>)+)/g,'<p class="q" style="margin:0">$1</p>');
  return `<article class="card qpage ${done?'is-done':''}" data-p="${k}"><div class="qhead"><span>Juz ${ay[0][3]}</span><span>Page ${k}</span></div>${html}
   <button class="btn ${done?'ghost':''}" data-act="qtick" data-v="${k}" style="align-self:center">${done?'✓ Page '+k+' read':'Mark page '+k+' read'}</button></article>`}
const stripNum=s=>s.replace(/[\s ]*[٠-٩]+\s*$/,'');

/* ---------- SALAH ---------- */
async function viewSalah(){
  const t=todayKey();if(ui.salahDay===null)ui.salahDay=t;const k=ui.salahDay,d=S.salah[k]||{};
  const nav=`<div class="daynav"><button class="iconbtn" data-act="sday" data-v="-1" aria-label="Previous day">${ICON.left}</button>
   <div style="text-align:center"><h2>${k===t?'Today':fmtDate(k,{weekday:'long'})}</h2><div class="small muted">${fmtDate(k,{day:'numeric',month:'long'})} · ${hijriText(k)}</div></div>
   <button class="iconbtn" data-act="sday" data-v="1" aria-label="Next day" ${k>=t?'disabled':''}>${ICON.right}</button></div>`;
  if(isPeriod(k)) return `<section class="view">${nav}<div class="card paused"><h2>Exempt</h2><p class="muted">This day is marked as a period day.</p></div></section>`;
  const fc=fardCount(k);
  return `<section class="view">${nav}
   <div class="card row between"><div><b class="tnum">${fc} of 5</b> <span class="muted">fard prayed</span></div>${ring(fc/5,40,5,'var(--done)')}</div>
   ${SALAH.map(p=>`<div class="card prayer"><div class="row between"><h3>${p.name}</h3><span class="small muted tnum">${p.parts.reduce((a,x)=>a+(d[p.id+'.'+x[0]]?x[1]:0),0)} rakats</span></div>
     <div class="parts">${p.parts.map(([id,n,l,opt])=>{const on=!!d[p.id+'.'+id];return `<button class="part ${opt?'opt':''} ${on?'on':''}" data-act="part" data-v="${p.id}.${id}" aria-pressed="${on}"><b>${n}</b>${l}${opt?' <span style="font-weight:400">(optional)</span>':''}</button>`}).join('')}</div></div>`).join('')}
   <div class="card prayer"><div class="row between"><h3>Tahajjud</h3>${ICON.moon.replace('<svg','<svg width="22" height="22" style="color:var(--muted)"')}</div>
     <div class="parts"><button class="part ${d.tahajjud?'on':''}" data-act="part" data-v="tahajjud" aria-pressed="${!!d.tahajjud}" style="min-width:120px"><b>${d.tahajjud?'✓':'○'}</b>${d.tahajjud?'Prayed':'Tap when prayed'}</button></div></div>
   <p class="small muted" style="margin:0;text-align:center">Hanafi breakdown. Dashed boxes are optional nafl.</p>
  </section>`;
}

/* ---------- ADHKAR ---------- */
async function viewAdhkar(){
  if(!ADHKAR)ADHKAR=await getJSON('adhkar.json');
  if(!ui.adhkar) ui.adhkar=new Date().getHours()<12?'m':'e';
  const t=todayKey(),d=adhkarDay(t),w=ui.adhkar;
  const seg=`<div class="seg" role="group" aria-label="Adhkar set">${[['m','Morning'],['e','Evening'],['z','Manzil']].map(([v,l])=>`<button data-act="aset" data-v="${v}" aria-pressed="${w===v}">${l}</button>`).join('')}</div>`;
  if(w==='z'){
    const Q=await quran();if(!MANZIL)MANZIL=await getJSON('manzil.json');
    let html='';for(const [s,a,b] of MANZIL){html+=`<div class="card"><div class="ref" style="text-align:center;margin-bottom:6px">${esc(Q.suras[s][1])} ${s}:${a}${b>a?'–'+b:''}</div>`;
      if(a===1&&s!==1&&s!==9) html+=`<div class="bism">${esc(stripNum(Q.ayahs[0][4]))}</div>`;
      html+=`<p class="q" style="margin:0">${[...Array(b-a+1)].map((_,i)=>esc(Q.bySA[s+':'+(a+i)][4])).join(' ')}</p></div>`}
    return `<section class="view">${seg}${html}<button class="btn ${d.z?'ghost':''}" data-act="manzil">${d.z?'✓ Manzil read today':'Mark Manzil read'}</button></section>`;
  }
  const list=ADHKAR[w==='m'?'morning':'evening'];const Q=list.some(x=>x.q)?await quran():null;await lwa();
  const doneN=list.filter((x,i)=>(d[w][i]||0)>=x.n).length;
  return `<section class="view">${seg}
   <p class="small muted" style="margin:0;text-align:center">${esc(ADHKAR.source)}. Tap a card to count.</p>
   <div class="card row between"><div><b class="tnum" id="acount">${doneN} of ${list.length}</b> <span class="muted">complete</span></div><button class="btn ghost small" data-act="areset">Reset</button></div>
   ${list.map((x,i)=>{const c=d[w][i]||0,done=c>=x.n;let body='';
     if(x.q){for(const [s,a,b] of x.q){ if(x.bism) body+=`<div class="bism">${esc(ADHKAR.bismillah)}</div>`;
       body+=`<p class="q" style="margin:0">${[...Array(b-a+1)].map((_,j)=>esc(Q.bySA[s+':'+(a+j)][4])).join(' ')}</p>`}}
     else body=lwaHTML(x.img);
     return `<div class="card dhikr ${done?'is-done':''}" role="button" tabindex="0" data-act="dhikr" data-v="${i}" aria-label="Count ${i+1}"><div class="row between"><span class="ref">${x.no}${x.ref?' · '+esc(x.ref):''}</span><span class="count tnum">${Math.min(c,x.n)}/${x.n}</span></div>${body}</div>`}).join('')}
  </section>`;
}

/* ---------- TASBIH ---------- */
function tasbihSum(id,from,to){const c=S.tasbih.counts[id]||{};let s=0;for(const k in c) if((!from||k>=from)&&(!to||k<=to)) s+=c[k];return s}
async function viewTasbih(){
  const t=todayKey(),mon=t.slice(0,8)+'01',yr=t.slice(0,5)+'01-01';
  const all=(f)=>S.tasbih.items.reduce((a,x)=>a+tasbihSum(x.id,f),0);
  return `<section class="view"><div style="text-align:center"><h1>Tasbih</h1></div>
   <div class="card stats4"><div><span>Today</span><b class="tnum">${all(t).toLocaleString()}</b></div><div><span>Month</span><b class="tnum">${all(mon).toLocaleString()}</b></div><div><span>Year</span><b class="tnum">${all(yr).toLocaleString()}</b></div><div><span>Lifetime</span><b class="tnum">${all().toLocaleString()}</b></div></div>
   ${S.tasbih.items.map(x=>{const c=(S.tasbih.counts[x.id]||{})[t]||0;return `<button class="card titem" data-act="tcount" data-v="${x.id}">
     ${x.ar?`<div class="ar" style="text-align:center;font-size:24px;color:var(--gold)" lang="ar">${esc(x.ar)}</div>`:''}
     <div class="name">${esc(x.name)}</div>
     <div class="progress" style="width:100%;margin-top:4px"><i style="width:${Math.min(100,c/x.target*100)}%;background:${c>=x.target?'var(--done)':'var(--accent)'}"></i></div>
     <div class="row between small" style="width:100%"><span class="muted">Target ×${x.target.toLocaleString()}</span><b class="tnum" style="color:${c>=x.target?'var(--done)':'var(--gold)'}">Today · ${c.toLocaleString()}</b></div></button>`}).join('')}
   <button class="btn ghost" data-act="tadd">+ Add your own</button></section>`;
}
let counterId=null;
function openCounter(id){counterId=id;drawCounter()}
function drawCounter(){const x=S.tasbih.items.find(i=>i.id===counterId);if(!x){document.getElementById('overlay').innerHTML='';return}
  const t=todayKey(),c=(S.tasbih.counts[x.id]||{})[t]||0,N=33,R=150,act=c%N;
  const beads=[...Array(N)].map((_,i)=>{const a=(-90+i*360/N)*Math.PI/180,bx=180+R*Math.cos(a),by=180+R*Math.sin(a),on=i<act||(c>0&&act===0);
    return `<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${i===act?12:10}" fill="${i===act?'var(--sky-3)':(on?'var(--accent)':'var(--card)')}" stroke="${i===act?'var(--gold)':'var(--line)'}" stroke-width="${i===act?3:1.5}"/>`}).join('');
  document.getElementById('overlay').innerHTML=`<div class="counter" role="dialog" aria-label="${esc(x.name)} counter">
   <div class="row between"><button class="iconbtn" data-act="tclose" aria-label="Back">${ICON.left}</button><div style="text-align:center"><h2>${esc(x.name)}</h2><div class="small muted">Target ×${x.target.toLocaleString()}</div></div><button class="btn ghost small" data-act="tundo">−1</button></div>
   ${x.ar?`<div class="ar" style="text-align:center;font-size:24px;color:var(--gold);margin-top:8px" lang="ar">${esc(x.ar)}</div>`:''}
   <div class="ring" data-act="tinc"><div class="beads"><svg viewBox="0 0 360 360" aria-hidden="true"><circle cx="180" cy="180" r="${R}" fill="none" stroke="var(--line)" stroke-width="2"/>${beads}</svg>
     <div class="num"><div><b class="tnum">${c.toLocaleString()}</b><span class="muted tnum">/ ${x.target.toLocaleString()}</span>${c>=x.target?'<div class="status ok" style="margin-top:8px">Target reached</div>':''}</div></div></div></div>
   <p class="small muted" style="text-align:center;margin:0">Tap anywhere on the beads to count. Keeps counting past the target.</p>
   ${S.tasbih.items.length>DEFAULT_TASBIH.length&&!DEFAULT_TASBIH.some(d=>d.id===x.id)?`<button class="btn ghost small" data-act="tdel" style="align-self:center;margin-top:10px">Remove this tasbih</button>`:''}</div>`;
}
function countTasbih(delta){const x=S.tasbih.items.find(i=>i.id===counterId);if(!x)return;const t=todayKey();
  const c=S.tasbih.counts[x.id]||(S.tasbih.counts[x.id]={});const before=c[t]||0;c[t]=Math.max(0,before+delta);
  if(delta>0){ if(c[t]===x.target) buzz([90,60,90,60,160]); else if(c[t]%33===0) buzz(45); else buzz(12);}
  save();drawCounter();}

/* ---------- settings ---------- */
function openSettings(){const H=hijriOf(todayKey());
  document.getElementById('overlay').innerHTML=`<div class="sheet" data-act="sclose"><div class="panel">
   <div class="row between"><h2>Settings</h2><button class="btn ghost small" data-act="sclose">Done</button></div>
   <div class="card"><div class="eyebrow">Sky</div><div class="seg" style="margin-top:10px">${[['auto','Auto'],['day','Day'],['night','Night']].map(([v,l])=>`<button data-act="theme" data-v="${v}" aria-pressed="${S.theme===v}">${l}</button>`).join('')}</div>
     <p class="small muted" style="margin:8px 0 0">Auto switches at Bradford sunrise and sunset.</p></div>
   <div class="card"><div class="eyebrow">Hijri date</div><div style="font-weight:600;margin:6px 0">${hijriText(todayKey())}</div>
     <div class="row"><button class="btn ghost small" data-act="hshift" data-v="-1">−1 day</button><button class="btn ghost small" data-act="hshift" data-v="1">+1 day</button></div>
     <p class="small muted" style="margin:8px 0 0">On the 29th the Home page asks if the moon was sighted. Use these only if the date is off.</p></div>
   <div class="card"><div class="eyebrow">Period history</div>${S.periods.length?S.periods.slice().reverse().slice(0,8).map((p,i)=>`<div class="row between" style="margin-top:8px"><span>${fmtDate(p.s)} → ${p.e?fmtDate(p.e):'now'}</span><button class="btn ghost small" data-act="pdel" data-v="${S.periods.length-1-i}">Remove</button></div>`).join(''):'<p class="small muted" style="margin:6px 0 0">None yet.</p>'}</div>
   <div class="card"><div class="eyebrow">Backup</div><p class="small muted" style="margin:6px 0 10px">Your progress lives on this phone. Save a backup now and then.</p>
     <div class="row" style="flex-wrap:wrap"><button class="btn small" data-act="bsave">Save backup file</button><button class="btn ghost small" data-act="bcopy">Copy backup code</button></div>
     <div class="field" style="margin-top:12px"><label for="restoreFile">Restore from file</label><input type="file" id="restoreFile" accept="application/json,.json"></div>
     <div class="field"><label for="restoreText">Or paste a backup code</label><textarea id="restoreText" rows="2"></textarea><button class="btn ghost small" data-act="brestore" style="align-self:flex-start">Restore</button></div></div>
   <p class="small muted" style="margin:0">Hadith: Sahih al-Bukhari, Arabic with Muhsin Khan's English. Quran: King Fahd Complex Uthmani Hafs text.</p>
  </div></div>`;
  document.getElementById('restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore)})}
function restore(txt){try{let s=txt.trim();if(!s.startsWith('{'))s=decodeURIComponent(escape(atob(s)));const o=JSON.parse(s);if(!o.v||!o.tasbih)throw 0;S=o;persistNow();toast('Backup restored');closeOverlay();render()}catch(e){toast('That backup code is not valid')}}
function closeOverlay(){document.getElementById('overlay').innerHTML='';counterId=null}
function addTasbih(){document.getElementById('overlay').innerHTML=`<div class="sheet" data-act="sclose"><div class="panel"><h2>New tasbih</h2>
  <div class="field"><label for="tn">Name</label><input id="tn" placeholder="e.g. SubhanAllah"></div>
  <div class="field"><label for="tt">Daily target</label><input id="tt" type="number" inputmode="numeric" value="100" min="1"></div>
  <div class="row"><button class="btn" data-act="tsave">Add</button><button class="btn ghost" data-act="sclose">Cancel</button></div></div></div>`}

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('sheet')&&e.target!==el)return; // taps inside a panel never close it
  const a=el.dataset.act,v=el.dataset.v,t=todayKey();
  switch(a){
   case 'tab':setTab(v);break;
   case 'settings':openSettings();break;
   case 'sclose':closeOverlay();if(tab==='home'||tab==='tasbih')render();break;
   case 'period':togglePeriod();break;
   case 'moon':answerMoon(v==='1');break;
   case 'fard':{const d=salahDay(t);d[v+'.f']=!d[v+'.f'];buzz(10);save();render();break}
   case 'part':{const d=salahDay(ui.salahDay);d[v]=!d[v];buzz(10);save();render();break}
   case 'sday':{const n=addDays(ui.salahDay,+v);if(n<=t){ui.salahDay=n;render()}break}
   case 'hday':ui.hDay=Math.max(0,Math.min(PLAN_DAYS-1,ui.hDay+ +v));scrollTo(0,0);render();break;
   case 'hmode':ui.hMode=v;scrollTo(0,0);render();break;
   case 'htick':{const n=v;if(S.hadith[n])delete S.hadith[n];else S.hadith[n]=1;buzz(10);save();
     const card=el.closest('.hcard');card.classList.toggle('is-done',!!S.hadith[n]);el.setAttribute('aria-pressed',!!S.hadith[n]);updateHadithHead();break}
   case 'hall':{const m=await meta();for(const n of m.plan[+v])S.hadith[n]=1;buzz(20);save();toast('Marked all read');render();break}
   case 'qtick':{const k=+v,y=scrollY;if(S.quran.pages[k])delete S.quran.pages[k];else{S.quran.pages[k]=t;}buzz(15);save();
     if(S.quran.pages[k]&&quranStatus().todayNeed===0)toast('Done for today, alhamdulillah');
     await render();scrollTo(0,y);break}
   case 'qpage':{const cur=document.querySelectorAll('.qpage');const first=+cur[0]?.dataset.p||1,last=+cur[cur.length-1]?.dataset.p||1;ui.qPage=Math.max(1,Math.min(QURAN_PAGES,(+v<0?first:last)+ +v));scrollTo(0,0);render();break}
   case 'qnext':ui.qPage=+v;scrollTo(0,0);render();break;
   case 'qjump':document.getElementById('overlay').innerHTML=`<div class="sheet" data-act="sclose"><div class="panel"><h2>Go to page</h2><div class="field"><label for="qp">Page (1–604)</label><input id="qp" type="number" inputmode="numeric" min="1" max="604" value="${ui.qPage||1}"></div><div class="row"><button class="btn" data-act="qgo">Go</button><button class="btn ghost" data-act="qtoday">Today's pages</button></div></div></div>`;break;
   case 'qgo':{const p=parseInt(document.getElementById('qp').value);if(p>=1&&p<=604){ui.qPage=p;closeOverlay();scrollTo(0,0);render()}break}
   case 'qtoday':ui.qPage=null;closeOverlay();scrollTo(0,0);render();break;
   case 'newkhatam':S.quran.khatam=(S.quran.khatam||0)+1;S.quran.pages={};ui.qPage=1;save();render();break;
   case 'aset':ui.adhkar=v;scrollTo(0,0);render();break;
   case 'dhikr':{const w=ui.adhkar,d=adhkarDay(t),x=ADHKAR[w==='m'?'morning':'evening'][+v];const c=(d[w][v]||0);
     if(c<x.n){d[w][v]=c+1;buzz(c+1===x.n?[40,40,60]:12);save();el.querySelector('.count').textContent=`${c+1}/${x.n}`;
       if(c+1===x.n){el.classList.add('is-done');const nx=el.nextElementSibling;if(nx)setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'start'}),250)}
       const list=ADHKAR[w==='m'?'morning':'evening'];const dn=list.filter((y,i)=>(d[w][i]||0)>=y.n).length;const ac=document.getElementById('acount');if(ac)ac.textContent=`${dn} of ${list.length}`;
       if(dn===list.length)toast(w==='m'?'Morning adhkar complete':'Evening adhkar complete');}
     break}
   case 'areset':{const d=adhkarDay(t);d[ui.adhkar]={};save();render();break}
   case 'manzil':{const d=adhkarDay(t);d.z=!d.z;save();render();break}
   case 'tcount':openCounter(v);break;
   case 'tinc':countTasbih(1);break;
   case 'tundo':countTasbih(-1);break;
   case 'tclose':closeOverlay();render();break;
   case 'tdel':{S.tasbih.items=S.tasbih.items.filter(i=>i.id!==counterId);save();closeOverlay();render();break}
   case 'tadd':addTasbih();break;
   case 'tsave':{const n=document.getElementById('tn').value.trim(),tg=parseInt(document.getElementById('tt').value)||100;if(!n){toast('Give it a name');break}
     S.tasbih.items.push({id:'c'+Date.now(),name:n,ar:'',target:Math.max(1,tg)});save();closeOverlay();render();break}
   case 'theme':S.theme=v;save();applySky();openSettings();break;
   case 'hshift':S.hijri.shift=(S.hijri.shift||0)+(+v);save();openSettings();break;
   case 'pdel':S.periods.splice(+v,1);save();openSettings();break;
   case 'bsave':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=`tracker-backup-${t}.json`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
   case 'bcopy':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{await navigator.clipboard.writeText(code);toast('Backup code copied. Paste it into Notes or WhatsApp')}catch(err){const ta=document.getElementById('restoreText');ta.value=code;ta.select();toast('Select all and copy the code')}break}
   case 'brestore':restore(document.getElementById('restoreText').value);break;
  }
});
async function updateHadithHead(){const m=await meta();const list=m.plan[ui.hDay];if(ui.hMode!=='day')return;const r=list.filter(n=>S.hadith[n]).length;
  const c=document.getElementById('hcount'),b=document.getElementById('hbar');if(c)c.textContent=`${r} of ${list.length}`;if(b)b.style.width=(r/list.length*100)+'%';}

/* ---------- boot ---------- */
const VIEWS={home:viewHome,hadith:viewHadith,quran:viewQuran,salah:viewSalah,adhkar:viewAdhkar,tasbih:viewTasbih};
load();applySky();
const h=location.hash.slice(1);if(VIEWS[h])tab=h;
render();
let lastDay=todayKey();setInterval(()=>{if(todayKey()!==lastDay){lastDay=todayKey();ui.hDay=null;ui.salahDay=null;render()}},30000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;persistNow();location.reload()});}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
